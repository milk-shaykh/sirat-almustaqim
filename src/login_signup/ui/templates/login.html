<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#fbfaf7">
        <title>تسجيل الدخول</title>
        <link rel="stylesheet" href="{{ url_for('login_signup.static', filename='login_signup.css') }}">
    </head>
    <body>
        <div class="auth-page">
            <div class="auth-shell">
                <div class="auth-copy">
                    <p class="eyebrow">اقرأ، وابحث، وتدبّر</p>
                    <h1>الصراط المستقيم</h1>
                    <p>القرآن الكريم والمكتبة الإسلامية في مكان واحد.</p>
                </div>

                <div class="auth-panel">
                    <div class="auth-card">
                        <p class="card-kicker">مرحبًا بعودتك</p>
                        <h2>تسجيل الدخول</h2>

                        <form class="auth-form" method="post">
                            <div class="auth-field">
                                <label for="username">اسم المستخدم</label>
                                <input id="username" name="username" type="text" required>
                            </div>

                            <div class="auth-field">
                                <label for="password">كلمة المرور</label>
                                <input id="password" name="password" type="password" required>
                            </div>

                            <button class="auth-submit" type="submit">دخول</button>
                        </form>

                        <p class="auth-switch">ليس لديك حساب؟ <a href="{{ url_for('login_signup.signup') }}">إنشاء حساب</a></p>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
