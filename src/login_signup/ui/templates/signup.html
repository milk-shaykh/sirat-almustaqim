<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#fbfaf7">
        <title>إنشاء حساب</title>
        <link rel="stylesheet" href="{{ url_for('login_signup.static', filename='login_signup.css') }}">
    </head>
    <body>
        <div class="auth-page">
            <div class="auth-shell">
                <div class="auth-copy">
                    <p class="eyebrow">اقرأ، وابحث، وتدبّر</p>
                    <h1>انضم إلى رحلتك</h1>
                    <p>أنشئ حسابك الآن وابدأ في استكشاف القرآن والمكتبة الإسلامية.</p>
                </div>

                <div class="auth-panel">
                    <div class="auth-card">
                        <p class="card-kicker">ابدأ الآن</p>
                        <h2>إنشاء حساب</h2>

                        <form class="auth-form" method="post">
                            <div class="auth-field">
                                <label for="username">اسم المستخدم</label>
                                <input id="username" name="username" type="text" required>
                            </div>

                            <div class="auth-field">
                                <label for="email">البريد الإلكتروني</label>
                                <input id="email" name="email" type="email" required>
                            </div>

                            <div class="auth-field">
                                <label for="password">كلمة المرور</label>
                                <input id="password" name="password" type="password" required>
                            </div>

                            <button class="auth-submit" type="submit">إنشاء الحساب</button>
                        </form>

                        <p class="auth-switch">لديك حساب بالفعل؟ <a href="{{ url_for('login_signup.login') }}">تسجيل الدخول</a></p>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
